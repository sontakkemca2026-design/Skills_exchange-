
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Campus Skill Exchange</title>

<style>
:root {
  --bg:#070b18;
  --panel:#10172b;
  --border:#293453;
  --text:#f6f7ff;
  --muted:#a5afc8;
  --purple:#8b5cf6;
  --blue:#32b7ff;
  --pink:#ed65d9;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  padding:28px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top right,#202052,transparent 45%),
    var(--bg);
}

.card {
  width:100%;
  max-width:570px;
  padding:32px;
  border:1px solid var(--border);
  border-radius:24px;
  background:linear-gradient(145deg,#121a30,#0b1120);
  box-shadow:0 20px 70px #0008;
}

.logo {
  text-align:center;
  font-size:27px;
  font-weight:800;
}

.logo span {
  color:#a68aff;
}

h1 {
  text-align:center;
  font-size:27px;
  margin:18px 0 8px;
}

.subtitle {
  text-align:center;
  color:var(--muted);
  margin:8px 0 24px;
}

.field-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 15px;
}

.field {
  margin-bottom:14px;
}

label {
  display:block;
  font-size:13px;
  margin-bottom:7px;
  color:#e1e6f7;
}

input {
  width:100%;
  padding:13px 12px;
  border-radius:11px;
  border:1px solid #303b5d;
  background:#090f20;
  color:var(--text);
  outline:none;
  font-size:14px;
}

input:focus {
  border-color:var(--purple);
  box-shadow:0 0 0 3px #8b5cf625;
}

input::placeholder {
  color:#74809e;
}

button {
  width:100%;
  padding:14px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(
    110deg,var(--purple),#4569ff,var(--blue)
  );
}

button:hover {
  filter:brightness(1.12);
}

button:disabled {
  opacity:0.6;
  cursor:not-allowed;
}

.message {
  display:none;
  margin:15px 0 0;
  padding:12px;
  border-radius:10px;
  font-size:13px;
}

.message.error {
  display:block;
  background:#471c32;
  color:#ffc6dc;
  border:1px solid #92375d;
}

.message.success {
  display:block;
  background:#12372f;
  color:#a5f5d7;
  border:1px solid #267b60;
}

.note {
  font-size:12px;
  color:var(--muted);
  margin-top:13px;
  line-height:1.6;
}

.bottom {
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-top:21px;
}

a {
  color:#b4a0ff;
  text-decoration:none;
}

a:hover {
  text-decoration:underline;
}

@media(max-width:500px) {
  .card {
    padding:23px 18px;
  }

  .field-grid {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    🎓 Campus <span>Skill Exchange</span>
  </div>

  <h1>Create Your Account</h1>

  <p class="subtitle">
    Join your campus community and start sharing skills.
  </p>

  <form id="registerForm">

    <div class="field-grid">

      <div class="field">
        <label for="username">Username *</label>
        <input
          id="username"
          name="username"
          required
          minlength="3"
          maxlength="30"
          pattern="[A-Za-z0-9_]+"
          autocomplete="username"
          placeholder="e.g. student_01">
      </div>

      <div class="field">
        <label for="email">Email Address *</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          maxlength="100"
          autocomplete="email"
          placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          maxlength="64"
          autocomplete="new-password"
          placeholder="Minimum 8 characters">
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password *</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          required
          minlength="8"
          maxlength="64"
          autocomplete="new-password"
          placeholder="Enter password again">
      </div>

      <div class="field">
        <label for="course">Course / Department *</label>
        <input
          id="course"
          name="course"
          required
          maxlength="80"
          placeholder="e.g. MCA">
      </div>

      <div class="field">
        <label for="mobile">Mobile Number *</label>
        <input
          id="mobile"
          name="mobile"
          type="tel"
          required
          inputmode="numeric"
          pattern="[6-9][0-9]{9}"
          maxlength="10"
          autocomplete="tel"
          placeholder="10-digit mobile number">
      </div>

    </div>

    <div class="field">
      <label for="college">College Name *</label>
      <input
        id="college"
        name="college"
        required
        maxlength="150"
        autocomplete="organization"
        placeholder="Enter your college name">
    </div>

    <p class="note">
      Password must contain at least 8 characters, including
      an uppercase letter, a lowercase letter, a number,
      and a special character.
    </p>

    <button type="submit" id="registerButton">
      Create Account ↗
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite">
    </div>

  </form>

  <div class="bottom">
    Already registered?
    <a href="login.html">Login here</a>
  </div>

  <div class="bottom">
    <a href="main.html">← Back to Home</a>
  </div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerButton = document.getElementById("registerButton");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

async function hashPassword(password) {

  const bytes = new TextEncoder().encode(password);

  const hash = await crypto.subtle.digest("SHA-256", bytes);

  return Array.from(new Uint8Array(hash))
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const username = form.username.value.trim();
  const email = form.email.value.trim().toLowerCase();
  const password = form.password.value;
  const confirmPassword = form.confirmPassword.value;
  const course = form.course.value.trim();
  const mobile = form.mobile.value.trim();
  const college = form.college.value.trim();

  if (
    username.length < 3 ||
    !/^[A-Za-z0-9_]+$/.test(username)
  ) {
    showMessage(
      "Username must be at least 3 characters and contain only letters, numbers, and underscores.",
      "error"
    );
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage("Please enter a valid email address.", "error");
    return;
  }

  if (
    !/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,64}$/.test(password)
  ) {
    showMessage(
      "Password must have 8–64 characters, uppercase and lowercase letters, a number, and a special character.",
      "error"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage(
      "Passwords do not match. Please enter them again.",
      "error"
    );
    return;
  }

  if (!/^[6-9]\d{9}$/.test(mobile)) {
    showMessage(
      "Enter a valid 10-digit Indian mobile number starting with 6, 7, 8, or 9.",
      "error"
    );
    return;
  }

  if (!course || !college) {
    showMessage(
      "Please enter your course and college name.",
      "error"
    );
    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "Creating Account...";

  try {

    const passwordHash = await hashPassword(password);

    const formData = new URLSearchParams();

    formData.append("username", username);
    formData.append("email", email);
    formData.append("passwordHash", passwordHash);
    formData.append("course", course);
    formData.append("mobile", mobile);
    formData.append("college", college);

    const response = await fetch("/api/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formData.toString()
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      showMessage(
        result.message || "Registration failed. Please try again.",
        "error"
      );
      return;
    }

    showMessage(
      "Registration successful! Please login with your account.",
      "success"
    );

    form.reset();

    setTimeout(function() {
      window.location.href = "login.html";
    }, 1400);

  } catch (error) {

    showMessage(
      "Cannot connect to the server. Make sure campus_web.exe is running.",
      "error"
    );

  } finally {

    registerButton.disabled = false;
    registerButton.textContent = "Create Account ↗";

  }

});

</script>

</body>
</html>
